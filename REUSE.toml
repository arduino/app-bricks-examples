version = 1

# Arduino-authored source, docs and assets.
# Keep this broad, but avoid swallowing vendored third-party trees.
[[annotations]]
path = [
  "README.md",
  "learn-docs/**/*.md",
  "learn-docs/**/assets/**",
  "learn-docs/_icons/**",
  "inspirational/**/*.py",
  "inspirational/**/*.ino",
  "inspirational/**/*.h",
  "inspirational/**/*.md",
  "inspirational/**/*.yaml",
  "inspirational/**/*.txt",
  "inspirational/**/assets/*.html",
  "inspirational/**/assets/*.css",
  "inspirational/**/assets/*.js",
  "inspirational/**/assets/**/*.json",
  "inspirational/**/assets/**/*.png",
  "inspirational/**/assets/**/*.jpg",
  "inspirational/**/assets/**/*.jpeg",
  "inspirational/**/assets/**/*.svg",
  "inspirational/**/assets/**/*.gif",
  "inspirational/**/assets/**/*.webp",
  "inspirational/**/assets/**/*.wav",
  "core-and-foundational/**/**/*.py",
  "core-and-foundational/**/**/*.ino",
  "core-and-foundational/**/**/*.h",
  "core-and-foundational/**/**/*.md",
  "core-and-foundational/**/**/*.yaml",
  "core-and-foundational/**/**/*.txt",
  "core-and-foundational/**/**/assets/*.html",
  "core-and-foundational/**/**/assets/*.css",
  "core-and-foundational/**/**/assets/*.js",
  "core-and-foundational/**/**/assets/**/*.json",
  "core-and-foundational/**/**/assets/**/*.png",
  "core-and-foundational/**/**/assets/**/*.jpg",
  "core-and-foundational/**/**/assets/**/*.jpeg",
  "core-and-foundational/**/**/assets/**/*.svg",
  "core-and-foundational/**/**/assets/**/*.gif",
  "core-and-foundational/**/**/assets/**/*.webp",
  "core-and-foundational/**/**/assets/**/*.wav",
  "bricks/**/*.py",
  "bricks/**/*.ino",
  "bricks/**/*.h",
  "bricks/**/*.md",
  "bricks/**/*.yaml",
  "bricks/**/*.txt",
  "bricks/**/assets/*.html",
  "bricks/**/assets/*.css",
  "bricks/**/assets/*.js",
  "bricks/**/assets/**/*.json",
  "bricks/**/assets/**/*.png",
  "bricks/**/assets/**/*.jpg",
  "bricks/**/assets/**/*.jpeg",
  "bricks/**/assets/**/*.svg",
  "bricks/**/assets/**/*.gif",
  "bricks/**/assets/**/*.webp",
  "bricks/**/assets/**/*.wav",
]
SPDX-FileCopyrightText = "Copyright (C) Arduino s.r.l. and/or its affiliated companies"
SPDX-License-Identifier = "MPL-2.0"

# Third-party fonts (Open Sans, Roboto) distributed under OFL-1.1
[[annotations]]
path = [
  "inspirational/**/assets/fonts/**/*.ttf",
  "inspirational/**/assets/fonts/**/*.css",
  "inspirational/**/assets/fonts/**/OFL.txt",
  "core-and-foundational/**/**/assets/fonts/**/*.ttf",
  "core-and-foundational/**/**/assets/fonts/**/*.css",
  "core-and-foundational/**/**/assets/fonts/**/OFL.txt",
]
SPDX-FileCopyrightText = "Copyright (c) Google LLC"
SPDX-License-Identifier = "OFL-1.1"
precedence = "override"

# Arduino support modules that may live alongside third-party files in
# assets/libs/ remain first-party code and should keep the project license.
[[annotations]]
path = [
  "inspirational/**/assets/libs/arduino.js",
  "bricks/**/assets/libs/arduino.js",
]
SPDX-FileCopyrightText = "Copyright (C) Arduino s.r.l. and/or its affiliated companies"
SPDX-License-Identifier = "MPL-2.0"
precedence = "override"

# Third-party JS libraries. Keep them out of automatic header rewriting and
# cover them via annotations so their upstream headers stay untouched.
[[annotations]]
path = [
  "inspirational/**/assets/libs/socket.io.min.js",
  "core-and-foundational/**/**/assets/libs/socket.io.min.js",
  "bricks/**/assets/libs/socket.io.min.js",
]
SPDX-FileCopyrightText = "Copyright (c) 2014-2024 Guillermo Rauch"
SPDX-License-Identifier = "MIT"
precedence = "override"

[[annotations]]
path = "inspirational/**/assets/libs/qrcode.min.js"
SPDX-FileCopyrightText = "Copyright (c) David Shim"
SPDX-License-Identifier = "MIT"
precedence = "override"

[[annotations]]
path = "inspirational/**/assets/libs/dotlottie-player.js"
SPDX-FileCopyrightText = "Copyright (c) 2023 LottieFiles.com"
SPDX-License-Identifier = "MIT"
precedence = "override"

# Configuration & generated files
[[annotations]]
path = [
  ".github/**",
  ".editorconfig",
  ".licenses/**",
  ".gitignore",
  ".licensed.yml",
  ".prettierignore",
  ".prettierrc.json",
  "*.dist.yml",
  "**/requirements.txt",
  "eslint.config.mjs",
  "REUSE.toml",
  "ruff.toml",
]
SPDX-FileCopyrightText = "Copyright (C) Arduino s.r.l. and/or its affiliated companies"
SPDX-License-Identifier = "CC0-1.0"
precedence = "override"

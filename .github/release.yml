# Categories of the release notes GitHub generates for each release
# (release.yml workflow, generate_release_notes), by pull request label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New examples
      labels:
        - example
        - enhancement
        - feature
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Learn docs
      labels:
        - docs
        - documentation
    - title: CI and tooling
      labels:
        - ci
        - chore
        - tooling
    - title: Other changes
      labels:
        - "*"

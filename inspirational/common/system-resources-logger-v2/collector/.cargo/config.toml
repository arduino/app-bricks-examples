# Static aarch64 build linked with the lld shipped by rustup: no C cross-toolchain needed,
# works from Windows, macOS or Linux.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=+crt-static"]

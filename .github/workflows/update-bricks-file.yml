name: Update bricks dependency to the latest stable version

# Keeps requirements.txt on main pinned to the latest stable app-bricks-py
# release, with the dependency license records refreshed for it, through a pull
# request. Runs daily, by hand, and from release.yml when a stable release of the
# examples finds the pin on main stale. Pre-releases never reach main: release.yml
# pins them in the released package only (task bricks:pin in its workspace).

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Run every day at 8:00 AM UTC
    - cron: '0 8 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-bricks:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.13'
      TASKFILE_VERSION: 'v3.44.0'
      TASKFILE_PATH: '/home/runner/go/bin'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest stable bricks version
        id: get-latest-version
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/arduino/app-bricks-py/releases \
            | jq -r '[.[] | select(
                .prerelease == false
                and .draft == false
                and (.tag_name | test("^(bricks|release)/[0-9]+\\.[0-9]+\\.[0-9]+$"))
              )][0].tag_name // empty')
          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::No stable app-bricks release found (expected tag bricks/X.Y.Z or release/X.Y.Z)"
            exit 1
          fi
          LATEST_RELEASE=${LATEST_TAG#*/}
          echo "LATEST_TAG=$LATEST_TAG"
          echo "LATEST_RELEASE=$LATEST_RELEASE"
          if [[ ! "$LATEST_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $LATEST_RELEASE (expected X.Y.Z)"
            exit 1
          fi
          echo "LATEST_RELEASE=$LATEST_RELEASE" >> $GITHUB_OUTPUT

      - name: Decide whether an update PR is needed
        id: plan
        env:
          LATEST_RELEASE: ${{ steps.get-latest-version.outputs.LATEST_RELEASE }}
        run: |
          if git ls-remote --heads origin "update-bricks-${LATEST_RELEASE}" | grep -q "update-bricks-${LATEST_RELEASE}"; then
            echo "Branch update-bricks-${LATEST_RELEASE} already exists: the PR is pending."
            echo "update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          CURRENT_VERSION=$(grep 'arduino_app_bricks' requirements.txt | sed -E 's/.*%2F([^/]+)\/.*/\1/')
          echo "CURRENT_VERSION=$CURRENT_VERSION"
          if [ "$CURRENT_VERSION" = "$LATEST_RELEASE" ]; then
            echo "No update needed. Current version is up to date."
            echo "update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "update=true" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.plan.outputs.update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Ruby
        if: steps.plan.outputs.update == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Install Taskfile
        if: steps.plan.outputs.update == 'true'
        run: |
          which task || curl -sSfL https://taskfile.dev/install.sh | sh -s -- -b ${{ env.TASKFILE_PATH }} ${{ env.TASKFILE_VERSION }}
          echo "${{ env.TASKFILE_PATH }}" >> "$GITHUB_PATH"

      - name: Pin requirements.txt and refresh the license records
        if: steps.plan.outputs.update == 'true'
        env:
          LATEST_RELEASE: ${{ steps.get-latest-version.outputs.LATEST_RELEASE }}
        run: |
          task bricks:pin -- "$LATEST_RELEASE"
          task license:headers

      - name: Create Pull Request
        if: steps.plan.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: update-bricks-${{ steps.get-latest-version.outputs.LATEST_RELEASE }}
          title: "Update bricks to ${{ steps.get-latest-version.outputs.LATEST_RELEASE }}"
          body: "This PR updates the Arduino App Bricks dependency to the latest stable version ${{ steps.get-latest-version.outputs.LATEST_RELEASE }} and refreshes the dependency license records."
          commit-message: "chore: update bricks to ${{ steps.get-latest-version.outputs.LATEST_RELEASE }}"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

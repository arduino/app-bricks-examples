[package]
name = "sysmon-collector"
version = "2.0.0"
edition = "2021"
description = "System metrics collector (CPU, RAM, network, disk, GPU, NPU, firmware) for Arduino UNO Q / VENTUNO Q"
license = "MPL-2.0"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
